<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Woodstock</title>
    <link rel="icon" type="image/png" href="images/woodstock.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: #fff4a3;
            color: #3d2b1f;
        }

        main {
            padding: 2rem;
        }

        img {
            width: 180px;
            max-width: 70%;
        }

        h1 {
            margin: 1rem 0 0.5rem;
            font-size: 2.5rem;
        }

        p {
            margin: 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <img src="images/woodstock.png" alt="Woodstock from Peanuts">
        <h1>Welcome to Woodstock's Corner</h1>
        <p>A little bird with a big personality.</p>
    </main>
</body>
</html>
