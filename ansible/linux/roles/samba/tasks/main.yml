---
# Samba Deployment
# Author: Braeden Villano (bcv4079@rit.edu)
# Date: 9/10/2026
- name: Install necessary packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: 
      - samba
      - samba-common-bin
      - smbclient
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install necessary packages (Red Hat and RHEL-like)
  ansible.builtin.dnf:
    name:
      - samba
      - samba-common
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"

#Uses variables defined in vars/main.yml under Samba role
- name: Ensure share directory exists
  ansible.builtin.file:
    path: "{{ smb_share_path }}"        
    state: directory
    owner: "{{ smb_share_owner }}"
    group: "{{ smb_share_group }}"
    mode: '0755'

- name: Enable and start smbd service
  ansible.builtin.service:
    name: "smbd"
    state: started
    enabled: true

#SMBD and NMBD are the two daemons for Samba (Server Message Block and NetBIOS Message Block)

- name: Enable and start nmbd service
  ansible.builtin.service:
    name: "nmbd"
    state: started
    enabled: true

#Copy over SMB config file
- name: Deploy smb.conf
  ansible.builtin.copy:
    src: smb.conf
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'

#Restart services after config change to take effect

- name: Restart SMBD service
  ansible.builtin.service:
    name: "smbd"
    state: restarted

- name: Restart NMBD service 
  ansible.builtin.service:
    name: "nmbd"
    state: restarted


# Feature 1: Copy over file with snoopy ASCII art which can be checked for scorecheck
- name: Copy over scorecheck file
  ansible.builtin.copy:
    src: snoopy.txt
    dest: "{{ smb_share_path }}/snoopy.txt"
    owner: "{{ smb_share_owner }}"
    group: "{{ smb_share_group }}"
    mode: '0644'

#Feature 2: Add greyteam user with authorized keys
#Create user for use by greyteam
- name: Create greyteam user
  ansible.builtin.user:
    name: greyteam
    shell: /bin/bash
    password: "{{ 'CabinHackStack1#' | password_hash('sha512') }}"

#Debian uses sudo group for users with sudo perms
- name: Add greyteam user to sudo group (Debian-based)
  ansible.builtin.user:
      name: username_here
      groups: sudo
      append: yes
  when: ansible_os_family == "Debian"

# RHEL-based systems use wheel for users that can sudo
- name: Add user to wheel group (RHEL-based)
  ansible.builtin.user:
    name: username_here
    groups: wheel
    append: yes
  when: ansible_os_family == "RedHat"

 #Lets grey team users login to greyteam without a password
- name: Add grey team public keys to authorized keys for greyteam user
  ansible.builtin.authorized_key:
    user: "greyteam"
    state: present
    key: "{{ item }}"
    exclusive: false   # append, don't wipe out any existing keys for the user
  loop: "{{ greyteam_ssh_keys }}" # Each iteration of the loop has the key set as item variable

# Feature 3: Create smbusers group and add users to it, used by Samba for authorized users + setup samba passwords for 2 users
- name: Ensure smbusers group exists
  ansible.builtin.group:
    name: "smbusers"
    state: present

- name: Add users to smbusers group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "smbusers"
    append: true   #append, don't replace existing group memberships
  loop: 
    - ubuntu
    - greyteam

- name: Set Samba password for ubuntu 
  ansible.builtin.shell: |
    (echo "ChangeMe123#"; echo "ChangeMe123#") | smbpasswd -a -s ubuntu 
  no_log: true   

- name: Set Samba password for greyteam 
  ansible.builtin.shell: |
    (echo "CabinHackStack1#"; echo "CabinHackStack1#") | smbpasswd -a -s greyteam
  no_log: true   # prevents passwords from appearing in Ansible output/logs