[global]
   workgroup = SNOOPY
   server string = Snoopy SMB Server
   security = user
   map to guest = never
   min protocol = SMB2
   log file = /var/log/samba/log.%m
   log level = 1

[snoopy]
   comment = Snoopy SMB Share
   path = /srv/samba/snoopy
   browsable = yes
   read only = no
   guest ok = yes
   valid users = @smbusers